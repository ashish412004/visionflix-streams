<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <!-- Pink background square -->
  <rect width="40" height="40" fill="#FF69B4" rx="8"/>
  
  <!-- White circle border -->
  <circle cx="20" cy="20" r="16" fill="white" stroke="black" stroke-width="2"/>
  
  <!-- Vintage film camera silhouette -->
  <g fill="black">
    <!-- Camera body -->
    <rect x="12" y="15" width="16" height="10" rx="1"/>
    <!-- Film reel -->
    <circle cx="16" cy="20" r="3" fill="white"/>
    <circle cx="16" cy="20" r="1.5" fill="black"/>
    <!-- Camera lens -->
    <circle cx="24" cy="20" r="4"/>
    <circle cx="24" cy="20" r="2" fill="white"/>
    <!-- Viewfinder -->
    <rect x="18" y="11" width="4" height="3" rx="0.5"/>
    <!-- Film strip holes -->
    <rect x="13" y="17" width="1" height="1" fill="white"/>
    <rect x="13" y="19" width="1" height="1" fill="white"/>
    <rect x="13" y="21" width="1" height="1" fill="white"/>
    <rect x="26" y="17" width="1" height="1" fill="white"/>
    <rect x="26" y="19" width="1" height="1" fill="white"/>
    <rect x="26" y="21" width="1" height="1" fill="white"/>
  </g>
</svg>
